spring.application.name=traditional-market-backend
spring.profiles.default=local
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/**

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] requestId=%X{requestId:-} %logger{36} - %msg%n

# 토스페이먼츠 테스트 결제 전용 설정입니다. 실결제 키는 이 단계에서 허용하지 않습니다.
app.toss-payments.secret-key=${TOSS_PAYMENTS_SECRET_KEY:}
app.toss-payments.base-url=${TOSS_PAYMENTS_API_BASE_URL:https://api.tosspayments.com}
