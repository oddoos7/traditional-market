spring.datasource.url=jdbc:h2:mem:traditional_market;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 로컬 개발 환경에서만 생성되는 관리자 계정입니다.
app.local-admin.email=admin@traditional-market.local
app.local-admin.password=admin1234!
app.local-admin.name=시장 관리자
